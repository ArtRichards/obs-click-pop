[project]
name = "obs-click-pop"
version = "1.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests requiring a running OBS instance",
    "native: tests driving headless libobs through the installed obspython bindings",
]
addopts = "-m 'not e2e and not native'"
